<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - AgroAssist</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="page-header">
            <a href="../index.html" class="back-btn">←</a>
            <h1>My Profile</h1>
        </header>


        <!-- Profile -->
        <section class="profile-card">

            <div class="profile-avatar">
                👨‍🌾
            </div>

            <h2>Farmer Profile</h2>

            <p>Add your details to personalize AgroAssist.</p>

        </section>


        <!-- Personal Details -->
        <section class="profile-section">

            <h2>👤 Personal Details</h2>

            <div class="form-group">
                <label for="farmerName">Name</label>

                <input
                    type="text"
                    id="farmerName"
                    placeholder="Enter your name"
                >
            </div>


            <div class="form-group">
                <label for="farmerPhone">Phone Number</label>

                <input
                    type="tel"
                    id="farmerPhone"
                    placeholder="Enter your phone number"
                >
            </div>

        </section>


        <!-- Farm Details -->
        <section class="profile-section">

            <h2>🌱 Farm Details</h2>

            <div class="form-group">
                <label for="cropName">Crop</label>

                <input
                    type="text"
                    id="cropName"
                    placeholder="Enter crop name"
                >
            </div>


            <div class="form-group">
                <label for="farmSize">Farm Size</label>

                <input
                    type="text"
                    id="farmSize"
                    placeholder="Enter farm size"
                >
            </div>


            <div class="form-group">
                <label for="farmLocation">Location</label>

                <input
                    type="text"
                    id="farmLocation"
                    placeholder="Enter farm location"
                >
            </div>

        </section>


        <!-- Save -->
        <button class="save-profile-btn" id="saveProfileBtn">
            Save Details
        </button>


        <!-- Preferences -->
        <section class="profile-section">

            <h2>⚙️ Preferences</h2>

            <div class="profile-option">
                <span>🔔 Notifications</span>
                <span>›</span>
            </div>

            <div class="profile-option">
                <span>🌐 Language</span>
                <span>English ›</span>
            </div>

        </section>


        <!-- Back -->
        <a href="../index.html" class="primary-link">
            ← Back to Dashboard
        </a>

    </div>


    <script src="../js/app.js"></script>

</body>
</html>
